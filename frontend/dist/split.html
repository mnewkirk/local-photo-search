<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Split — Photo Search</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* The handoff is built on the Organic system (cream/terracotta). Per its
       own guidance we map the ROLES onto this app's dark palette rather than
       transplanting the hexes: terracotta accent -> --accent, sage second
       accent -> --green, sand ground -> --surface. */
    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --surface2: #242424;
      --border: #333;
      --text: #e8e8e8;
      --text-muted: #888;
      --text-dim: #666;
      --accent: #4a9eff;
      --accent-hover: #6bb3ff;
      --green: #4ade80;
      --yellow: #facc15;
      --red: #f87171;
      --radius: 8px;
    }

    html, body, #root { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      position: sticky; top: 0; z-index: 100;
    }
    .header-inner {
      max-width: 1600px; margin: 0 auto;
      display: flex; align-items: center; gap: 16px; min-height: 42px;
    }
    .logo { font-size: 18px; font-weight: 700; letter-spacing: -0.5px; }
    .logo span { color: var(--accent); }
    .nav-link { font-size: 13px; color: var(--accent); text-decoration: none; margin-left: 4px; }
    .nav-link:hover { text-decoration: underline; }
    .nav-link.active { color: var(--text); font-weight: 600; }

    .shell {
      max-width: 1600px; margin: 0 auto; padding: 24px;
      display: grid; grid-template-columns: 320px 1fr; gap: 24px; align-items: start;
    }
    @media (max-width: 1100px) { .shell { grid-template-columns: 1fr; } }

    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px;
    }
    .card + .card { margin-top: 16px; }
    .card h2 {
      font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--text-muted); font-weight: 600; margin-bottom: 12px;
    }

    .field { margin-bottom: 16px; }
    .field:last-child { margin-bottom: 0; }
    .field label {
      display: flex; justify-content: space-between; align-items: baseline;
      font-size: 13px; color: var(--text-muted); margin-bottom: 6px;
    }
    .field label b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
    input[type=range] { width: 100%; accent-color: var(--accent); }

    .seg { display: flex; gap: 4px; background: var(--surface2); padding: 3px; border-radius: 999px; }
    .seg button {
      flex: 1; border: 0; background: transparent; color: var(--text-muted);
      font-size: 12px; padding: 6px 8px; border-radius: 999px; cursor: pointer;
      font-family: inherit;
    }
    .seg button.on { background: var(--accent); color: #06121f; font-weight: 600; }

    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      border: 1px solid var(--border); background: var(--surface2); color: var(--text-muted);
      font-size: 12px; padding: 4px 10px; border-radius: 999px; cursor: pointer;
      font-family: inherit;
    }
    .chip.on { border-color: var(--accent); color: var(--accent); }

    .hint { font-size: 12px; color: var(--text-dim); margin-top: 8px; }

    .stage {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 20px;
      display: flex; flex-direction: column; align-items: center; gap: 14px;
    }
    .wallbox { position: relative; touch-action: none; user-select: none; cursor: grab; }
    .wallbox.drag { cursor: grabbing; }
    .panel { position: absolute; overflow: hidden; background: #000; }
    .panel img { position: absolute; max-width: none; }
    .ghost { position: absolute; inset: 0; pointer-events: none; }

    .specs { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .spec {
      background: var(--surface2); border: 1px solid var(--border); border-radius: 999px;
      padding: 4px 12px; font-size: 12px; color: var(--text-muted);
    }
    .spec b { color: var(--text); font-variant-numeric: tabular-nums; }
    .spec.warn b { color: var(--yellow); }
    .spec.bad b { color: var(--red); }
    .spec.good b { color: var(--green); }

    .arrangements { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
    .arr {
      background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 10px; cursor: pointer; text-align: left; color: var(--text);
      font-family: inherit; font-size: 12px;
    }
    .arr:hover { border-color: var(--accent); }
    .arr.on { border-color: var(--accent); background: #12243a; }
    .arr .big { font-size: 14px; font-weight: 600; display: block; margin-bottom: 2px; }
    .arr .sub { color: var(--text-muted); }
    .arr { position: relative; }
    /* A grid the user asked to see, rather than one the ranker chose. */
    .arr.tried { border-style: dashed; }
    .arr .del {
      position: absolute; top: 4px; right: 4px; width: 20px; height: 20px;
      border: 0; border-radius: 50%; background: var(--surface);
      color: var(--text-muted); font-size: 14px; line-height: 1;
      cursor: pointer; font-family: inherit; opacity: 0;
    }
    .arr:hover .del { opacity: 1; }
    .arr .del:hover { color: var(--red); }
    /* Thumbnail: centre the wall inside a fixed square so cards align. */
    .mini {
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 8px; overflow: hidden;
    }
    .mini .wallbox { cursor: inherit; }
    .mini .panel { background: #111; }

    .diag { border-left: 3px solid var(--yellow); padding-left: 14px; }
    .diag h3 { font-size: 16px; margin-bottom: 8px; }
    .diag p { font-size: 13px; color: var(--text-muted); }
    .diag .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }

    button.primary {
      background: var(--accent); color: #06121f; border: 0; border-radius: 999px;
      padding: 8px 16px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit;
    }
    button.primary:hover { background: var(--accent-hover); }
    button.primary:disabled { opacity: 0.5; cursor: wait; }
    button.ghostbtn {
      background: transparent; color: var(--accent); border: 1px solid var(--border);
      border-radius: 999px; padding: 8px 16px; font-size: 13px; cursor: pointer; font-family: inherit;
    }
    .empty { color: var(--text-dim); font-size: 13px; text-align: center; padding: 40px 0; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
  <script src="/shared.js"></script>
  <script src="/split-geometry.js"></script>

  <script>
    const e = React.createElement;
    const { useState, useEffect, useCallback, useMemo, useRef } = React;
    const G = window.SplitGeom;
    const API = '';

    function qs(k) { return new URLSearchParams(location.search).get(k); }

    // --- sidebar ------------------------------------------------------------

    function Sidebar(props) {
      const s = props.s, set = props.set;
      const { ups, source, setSource, img, origImg } = props;
      const mp = (o) => o ? (o.w * o.h / 1e6).toFixed(1) + ' MP' : '';
      return e('div', null,
        // Source first: it sets the resolution everything below is judged
        // against, so it is a planning input, not an export detail.
        e('div', { className: 'card' },
          e('h2', null, 'Source'),
          e('select', {
            value: source,
            onChange: (ev) => setSource(ev.target.value),
            style: { width: '100%', background: 'var(--surface2)',
                     color: 'var(--text)', border: '1px solid var(--border)',
                     borderRadius: 6, padding: '7px 8px', fontSize: 13,
                     fontFamily: 'inherit' },
          },
            e('option', { value: '' },
              'Original' + (origImg ? ' — ' + origImg.w + '×' + origImg.h : '')),
            ups.map((u) => e('option', { key: u.output, value: u.output },
              u.label + ' — ' + u.width + '×' + u.height))),
          img && e('p', { className: 'hint' },
            mp(img) + ' available' +
            (origImg && img.w > origImg.w
              ? ' · ' + G.fmt(img.w / origImg.w) + '× the original'
              : '')),
          ups.length === 0 && e('p', { className: 'hint' },
            'No upscales yet. A wall piece usually needs one — upscale from the ' +
            'photo view, or use the button in the diagnostic below.')),
        e('div', { className: 'card' },
          e('h2', null, 'Wall'),
          e('div', { className: 'field' },
            e('label', null, 'Wall size', e('b', null, G.fmt(s.wall) + '″')),
            e('input', { type: 'range', min: 24, max: 120, step: 1, value: s.wall,
              onChange: (ev) => set({ wall: Number(ev.target.value) }) })),
          e('div', { className: 'field' },
            e('label', null, 'Gap between sheets', e('b', null, G.fmt(s.gutter) + '″')),
            e('input', { type: 'range', min: 0, max: 3, step: 0.125, value: s.gutter,
              onChange: (ev) => set({ gutter: Number(ev.target.value) }) })),
          e('div', { className: 'field' },
            e('label', null, 'Seam mode'),
            e('div', { className: 'seg' },
              ['window', 'continue'].map((m) => e('button', {
                key: m, className: s.mode === m ? 'on' : '',
                onClick: () => set({ mode: m }),
              }, m === 'window' ? 'Window' : 'Continue'))),
            e('p', { className: 'hint' }, s.mode === 'window'
              ? 'The image continues behind the gaps, as if seen through a window.'
              : 'The gaps are not part of the image; only the sheets carry it.')),
          e('div', { className: 'field' },
            e('label', null,
              e('span', null,
                e('input', { type: 'checkbox', checked: s.wallOnly,
                  onChange: (ev) => set({ wallOnly: ev.target.checked }),
                  style: { marginRight: 6 } }),
                'Only what fits my wall')))),

        e('div', { className: 'card' },
          e('h2', null, 'Printing'),
          e('div', { className: 'field' },
            e('label', null, 'Resolution floor', e('b', null, s.minDpi + ' dpi')),
            e('div', { className: 'chips' },
              G.DPIS.map((d) => e('button', {
                key: d, className: 'chip' + (s.minDpi === d ? ' on' : ''),
                onClick: () => set({ minDpi: d }),
              }, d)))),
          // The tradeoff, before they hit a wall.
          props.img && e('p', { className: 'hint' },
            'At ' + s.minDpi + ' dpi this file reaches ' +
            G.fmt(G.reachAtDpi(props.img, s.minDpi)) + '″ along its long edge. ' +
            'Wall-scale pieces need a lower floor — 120 dpi reaches ' +
            G.fmt(G.reachAtDpi(props.img, 120)) + '″.'),
          e('div', { className: 'field', style: { marginTop: 16 } },
            e('label', null, 'Crop allowance', e('b', null, G.pct(s.maxCrop))),
            e('div', { className: 'chips' },
              G.CROPS.map((c) => e('button', {
                key: c, className: 'chip' + (s.maxCrop === c ? ' on' : ''),
                onClick: () => set({ maxCrop: c }),
              }, c === 1 ? 'Any' : G.pct(c)))))),

        e('div', { className: 'card' },
          e('h2', null, 'Sheet sizes in play'),
          e('div', { className: 'chips' },
            G.SIZES.map((p) => {
              const lab = G.sizeLabel(p[0], p[1]);
              const on = !s.sizes || s.sizes.indexOf(lab) >= 0;
              return e('button', {
                key: lab, className: 'chip' + (on ? ' on' : ''),
                onClick: () => {
                  const cur = s.sizes || G.SIZES.map((q) => G.sizeLabel(q[0], q[1]));
                  set({ sizes: on ? cur.filter((x) => x !== lab) : cur.concat([lab]) });
                },
              }, lab + '″');
            })),
          e('div', { className: 'field', style: { marginTop: 16 } },
            e('label', null, 'Panel count'),
            e('div', { className: 'chips' },
              ['any', 2, 3, 4, 5, 6, 8, 12].map((c) => e('button', {
                key: c, className: 'chip' + (String(s.count) === String(c) ? ' on' : ''),
                onClick: () => set({ count: c }),
              }, c === 'any' ? 'Any' : c))))));
    }

    // --- preview ------------------------------------------------------------

    // Lays the photo across the sheets. Shared by the main stage and the little
    // previews on the arrangement cards, so a thumbnail is never a different
    // rendering of the geometry than the thing it previews.
    function PanelLayout(props) {
      const { img, cand, s, src, maxPx } = props;
      const P = G.plan(img, cand, s);
      const scale = maxPx / Math.max(P.outerW, P.outerH);
      const W = P.outerW * scale, H = P.outerH * scale;

      const panels = [];
      for (let r = 0; r < cand.rows; r++) {
        for (let c = 0; c < cand.cols; c++) {
          // Position on the wall.
          const left = c * (cand.pw + s.gutter) * scale;
          const top = r * (cand.ph + s.gutter) * scale;
          // The image is laid out across the whole field; each panel is a
          // window onto it, so the img is offset by this panel's origin.
          const fieldW = P.cW * scale, fieldH = P.cH * scale;
          const offX = s.mode === 'window' ? left : c * cand.pw * scale;
          const offY = s.mode === 'window' ? top : r * cand.ph * scale;
          panels.push(e('div', {
            key: r + '-' + c,
            className: 'panel',
            style: { left: left, top: top, width: cand.pw * scale, height: cand.ph * scale },
          }, src && e('img', {
            src: src, draggable: false,
            style: {
              width: fieldW * (img.w / P.cw), height: fieldH * (img.h / P.ch),
              left: -offX - (P.ox / P.cw) * fieldW,
              top: -offY - (P.oy / P.ch) * fieldH,
            },
          })));
        }
      }
      return { node: panels, W: W, H: H };
    }

    /** Card-sized preview: the panel breakdown and where the photo lands. */
    function MiniPreview(props) {
      const { W, H, node } = PanelLayout(props);
      return e('div', { className: 'mini', style: { width: props.maxPx, height: props.maxPx } },
        e('div', { className: 'wallbox', style: { width: W, height: H } }, node));
    }

    function Preview(props) {
      const { img, cand, s, maxPx } = props;
      const [drag, setDrag] = useState(null);
      const { node, W, H } = PanelLayout(props);

      // Drag pans the crop, but only along the axis that actually has slack.
      const onDown = (ev) => {
        setDrag({ x: ev.clientX, y: ev.clientY, sx: s.sx, sy: s.sy });
        ev.preventDefault();
      };
      useEffect(() => {
        if (!drag) return;
        const move = (ev) => {
          const dx = (ev.clientX - drag.x) / W * 2;
          const dy = (ev.clientY - drag.y) / H * 2;
          props.onPan({
            sx: Math.max(-1, Math.min(1, drag.sx - dx)),
            sy: Math.max(-1, Math.min(1, drag.sy - dy)),
          });
        };
        const up = () => setDrag(null);
        window.addEventListener('mousemove', move);
        window.addEventListener('mouseup', up);
        return () => {
          window.removeEventListener('mousemove', move);
          window.removeEventListener('mouseup', up);
        };
      }, [drag, W, H]);

      return e('div', {
        className: 'wallbox' + (drag ? ' drag' : ''),
        style: { width: W, height: H }, onMouseDown: onDown,
      }, node);
    }

    // --- diagnostics --------------------------------------------------------

    function Diagnostic(props) {
      const { d, img, s, set, photoId } = props;
      const [busy, setBusy] = useState(false);
      const [msg, setMsg] = useState(null);
      const scale = d.upscale ? G.upscaleFor(d.upscale) : null;

      // The whole reason upscaling matters here: a wall piece spreads one file
      // across many sheets, so dpi is the usual blocker and a bigger source is
      // the only real fix. needPx says exactly how much bigger.
      const upscale = () => {
        setBusy(true); setMsg(null);
        fetch(API + '/api/admin/upscale-photo', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          // Exactly the factor the plan needs — Topaz takes decimals, so a
          // 1.3x shortfall does not have to be paid for at 2x.
          body: JSON.stringify({ photo_ids: [photoId], scale: scale,
                                 enhancements: ['upscale'] }),
        }).then((r) => r.json()).then((data) => {
          const err = (data.errors || [])[0];
          const res = (data.results || [])[0];
          if (err) setMsg({ kind: 'err', text: 'Upscale failed: ' + err.error });
          else if (res) {
            setMsg({ kind: 'ok', text: 'Upscaled to ' + scale + '×. Reloading with the larger file…' });
            props.onUpscaled(res);
          }
          setBusy(false);
        }).catch((ex) => { setMsg({ kind: 'err', text: String(ex) }); setBusy(false); });
      };

      return e('div', { className: 'card' },
        e('div', { className: 'diag' },
          e('h3', null, d.title),
          e('p', null, d.body),
          e('div', { className: 'actions' },
            d.fix && e('button', {
              className: 'primary',
              onClick: () => {
                if (d.fix.kind === 'minDpi') set({ minDpi: d.fix.minDpi });
                else if (d.fix.kind === 'cropDpi') {
                  const next = { maxCrop: d.fix.maxCrop };
                  if (d.fix.minDpi != null) next.minDpi = d.fix.minDpi;
                  set(next);
                } else if (d.fix.kind === 'select') props.onSelectCand(d.fix.cand);
              },
            }, d.fix.label),
            // Only offered when it would actually resolve the blocker.
            photoId && scale && e('button', {
              className: 'ghostbtn', disabled: busy, onClick: upscale,
            }, busy ? 'Upscaling…' : 'Upscale ' + G.fmt(scale) + '× with Topaz'),
            photoId && d.upscale && !scale && e('span', { className: 'hint' },
              'Even a ' + G.MAX_UPSCALE + '× upscale would not reach ' +
              s.minDpi + ' dpi here.')),
          scale && e('p', { className: 'hint' },
            'That is the exact factor this plan needs — ' +
            G.commas(d.upscale.w) + ' × ' + G.commas(d.upscale.h) + ' px. ' +
            'Upscaling further only adds synthesized texture.'),
          msg && e('p', {
            className: 'hint',
            style: { color: msg.kind === 'err' ? 'var(--red)' : 'var(--green)' },
          }, msg.text)));
    }

    // --- export -------------------------------------------------------------

    function ExportBar(props) {
      // The source lives on the page, not here: it decides the resolution the
      // whole plan is computed against, not merely what the export reads.
      const { photoId, cand, s, source } = props;
      const [busy, setBusy] = useState(false);
      const [res, setRes] = useState(null);
      const [err, setErr] = useState(null);

      const run = () => {
        setBusy(true); setErr(null); setRes(null);
        fetch(API + '/api/admin/split-export', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            photo_id: photoId, pw: cand.pw, ph: cand.ph,
            cols: cand.cols, rows: cand.rows,
            gutter: s.gutter, mode: s.mode, sx: s.sx, sy: s.sy,
            source_path: source || null,
          }),
        }).then((r) => (r.ok ? r.json() : r.json().then((d) => {
          throw new Error(d.detail || r.statusText);
        }))).then((d) => { setRes(d); setBusy(false); })
          .catch((ex) => { setErr(String(ex.message || ex)); setBusy(false); });
      };

      return e('div', { style: { width: '100%', marginTop: 4 } },
        e('div', { style: { display: 'flex', gap: 8, alignItems: 'center',
                            flexWrap: 'wrap', justifyContent: 'center' } },
          e('button', { className: 'primary', onClick: run, disabled: busy },
            busy ? 'Exporting…' : 'Export ' + (cand.cols * cand.rows) + ' panels')),

        err && e('p', { className: 'hint', style: { color: 'var(--red)' } }, err),
        res && e('div', { style: { marginTop: 10, fontSize: 12, textAlign: 'center' } },
          e('p', { style: { color: 'var(--green)' } },
            (res.skipped ? 'Already exported — ' : 'Wrote ') + res.panels.length +
            ' panels at ' + res.dpi + ' dpi'),
          e('code', { style: { color: 'var(--text-muted)', wordBreak: 'break-all',
                               userSelect: 'all' } },
            res.dest_windows || res.dest),
          e('div', { style: { display: 'flex', gap: 8, flexWrap: 'wrap',
                              justifyContent: 'center', marginTop: 8 } },
            res.panels.map((p) => e('a', {
              key: p.output, target: '_blank', rel: 'noopener',
              href: API + '/api/admin/upscaled-file?path=' + encodeURIComponent(p.output),
            }, p.name.replace(/\.\w+$/, ''))))));
    }

    /** Two boxes for trying a grid the ranker did not offer. */
    function TryGrid(props) {
      const [cols, setCols] = useState('3');
      const [rows, setRows] = useState('2');
      const box = {
        width: 46, textAlign: 'center', background: 'var(--surface2)',
        color: 'var(--text)', border: '1px solid var(--border)',
        borderRadius: 6, padding: '4px 6px', fontSize: 13, fontFamily: 'inherit',
      };
      const [err, setErr] = useState(null);
      const submit = () => {
        const c = parseInt(cols, 10), r = parseInt(rows, 10);
        // Say why nothing happened rather than swallowing the input.
        if (!(c > 0 && r > 0)) return setErr('Enter whole numbers of 1 or more.');
        if (c > 8 || r > 8) return setErr('8 is the most panels on a side.');
        setErr(null);
        props.onAdd(c, r);
      };
      return e('div', { style: { display: 'flex', alignItems: 'center', gap: 6 } },
        e('span', { style: { fontSize: 12, color: 'var(--text-muted)' } }, 'Try'),
        e('input', { type: 'number', min: 1, max: 8, value: cols, style: box,
          onChange: (ev) => setCols(ev.target.value),
          onKeyDown: (ev) => { if (ev.key === 'Enter') submit(); } }),
        e('span', { style: { fontSize: 12, color: 'var(--text-muted)' } }, '×'),
        e('input', { type: 'number', min: 1, max: 8, value: rows, style: box,
          onChange: (ev) => setRows(ev.target.value),
          onKeyDown: (ev) => { if (ev.key === 'Enter') submit(); } }),
        e('button', { className: 'ghostbtn', style: { padding: '5px 12px', fontSize: 12 },
          onClick: submit }, 'Add'),
        err && e('span', { style: { fontSize: 11, color: 'var(--yellow)' } }, err));
    }

    // --- page ---------------------------------------------------------------

    function SplitPage() {
      const photoId = qs('photo') ? Number(qs('photo')) : null;
      const [photo, setPhoto] = useState(null);
      const [origImg, setOrigImg] = useState(null);   // the library original
      const [ups, setUps] = useState([]);             // prior Topaz exports
      const [source, setSource] = useState('');       // '' = original
      const [src, setSrc] = useState(null);
      const [sel, setSel] = useState(0);
      // Grids the user asked to see. Kept in localStorage so clicking away (or
      // reloading) does not lose them; removed only by the card's x.
      const TRIED_KEY = 'split.tried';
      const [tried, setTried] = useState(() => {
        try { return JSON.parse(localStorage.getItem(TRIED_KEY) || '[]'); }
        catch (_) { return []; }
      });
      const saveTried = useCallback((next) => {
        setTried(next);
        try { localStorage.setItem(TRIED_KEY, JSON.stringify(next)); } catch (_) {}
      }, []);
      const addTried = useCallback((c, r) => {
        setTried((prev) => {
          if (prev.some((t) => t.cols === c && t.rows === r)) return prev;
          const next = prev.concat([{ cols: c, rows: r }]);
          try { localStorage.setItem(TRIED_KEY, JSON.stringify(next)); } catch (_) {}
          return next;
        });
      }, []);
      const removeTried = useCallback((key) => {
        setTried((prev) => {
          const next = prev.filter((t) => 'try-' + t.cols + 'x' + t.rows !== key);
          try { localStorage.setItem(TRIED_KEY, JSON.stringify(next)); } catch (_) {}
          return next;
        });
      }, []);
      const [s, setS] = useState(Object.assign({}, G.DEFAULTS));
      const set = useCallback((patch) => setS((p) => Object.assign({}, p, patch)), []);

      // Load the photo's real pixel dimensions — every number on this page
      // depends on them, so we read them off the image rather than the DB.
      // Prior upscales are planning inputs, not just export inputs: picking a
      // 2x source doubles the resolution and changes which arrangements clear
      // the dpi floor.
      const loadUps = useCallback(() => {
        if (!photoId) return;
        fetch(API + '/api/admin/upscaled-list?photo_id=' + photoId)
          .then((r) => (r.ok ? r.json() : { exports: [] }))
          .then((d) => setUps((d.exports || []).filter((u) => u.width && u.height)))
          .catch(() => setUps([]));
      }, [photoId]);
      useEffect(() => { loadUps(); }, [loadUps]);

      useEffect(() => {
        if (!photoId) return;
        fetch(API + '/api/photos/' + photoId)
          .then((r) => r.json()).then((p) => setPhoto(p)).catch(() => {});
        const url = API + '/api/photos/' + photoId + '/preview';
        const im = new Image();
        im.onload = () => { setSrc(url); };
        im.src = url;
        // Full-resolution dims come from the detail record; the preview is only
        // for display, so its own dimensions must not drive the math.
        fetch(API + '/api/photos/' + photoId)
          .then((r) => r.json())
          .then((p) => {
            if (p && p.image_width && p.image_height) {
              setOrigImg({ w: p.image_width, h: p.image_height });
            }
          }).catch(() => {});
      }, [photoId]);

      const chosen = ups.find((u) => u.output === source) || null;
      const img = chosen ? { w: chosen.width, h: chosen.height } : origImg;

      const cands = useMemo(() => (img ? G.candidates(img, s) : []), [img, s]);

      // A tried grid is shown even when it fails the dpi/crop floors — seeing
      // WHY it does not work is the whole point of trying it. Pick the best
      // sheet size for that grid out of the physically-buildable set.
      const triedRows = useMemo(() => {
        if (!img) return [];
        return tried.map((t) => {
          // forGrid, not reachable(): the curated GRIDS list has no 3x3, and a
          // grid it does not list is precisely the case worth trying.
          const opts = G.forGrid(img, t.cols, t.rows, s);
          const key = 'try-' + t.cols + 'x' + t.rows;
          if (!opts.length) return { key: key, tried: true, impossible: true,
                                     cand: { cols: t.cols, rows: t.rows } };
          return Object.assign({}, opts[0], { tried: true, key: key });
        });
      }, [img, s, tried]);

      // Tried grids first, so a just-added one is easy to find.
      const shown = useMemo(
        () => triedRows.concat(cands.map((c, i) => Object.assign({}, c, { key: 'c' + i }))),
        [triedRows, cands]);
      const selIdx = Math.min(sel, Math.max(0, shown.length - 1));
      const cand = shown.length ? shown[selIdx] : null;
      const diag = useMemo(
        () => (img && !cands.length ? G.diagnose(img, s) : null), [img, cands, s]);

      useEffect(() => { setSel(0); }, [s.minDpi, s.maxCrop, s.count, s.wall, s.mode, s.gutter]);

      if (!photoId) {
        return e('div', null,
          e(PS.SharedHeader, { activePage: 'split' }),
          e('div', { className: 'shell' },
            e('div', { className: 'card' },
              e('p', { className: 'empty' },
                'Open a photo and choose “Split print” to plan a multi-panel piece.'))));
      }

      const P = cand && img ? G.plan(img, cand.cand, s) : null;

      return e('div', null,
        e(PS.SharedHeader, { activePage: 'split' }),
        e('div', { className: 'shell' },
          e(Sidebar, { s: s, set: set, img: img, ups: ups, source: source,
                       setSource: setSource, origImg: origImg }),
          e('div', null,
            !img && e('div', { className: 'card' }, e('p', { className: 'empty' }, 'Loading photo…')),

            img && P && e('div', { className: 'stage' },
              e(Preview, {
                img: img, cand: cand.cand, s: s, src: src, maxPx: 620,
                onPan: (p) => set(p),
              }),
              e('div', { className: 'specs' },
                e('div', { className: 'spec' }, 'Piece ',
                  e('b', null, G.inches(P.outerW) + ' × ' + G.inches(P.outerH))),
                e('div', { className: 'spec' }, cand.cand.cols + ' × ' + cand.cand.rows + ' of ',
                  e('b', null, G.sizeLabel(P.pw, P.ph) + '″')),
                e('div', {
                  className: 'spec ' + (P.dpi >= 240 ? 'good' : P.dpi >= 150 ? 'warn' : 'bad'),
                }, 'Resolution ', e('b', null, Math.round(P.dpi) + ' dpi')),
                e('div', {
                  className: 'spec ' + ((1 - P.keep) <= 0.15 ? 'good' : (1 - P.keep) <= 0.35 ? 'warn' : 'bad'),
                }, 'Crop ', e('b', null, G.pct(1 - P.keep))),
                e('div', { className: 'spec' }, 'Binds on ', e('b', null, P.bindingAxis))),
              e('p', { className: 'hint' }, 'Drag the preview to reposition the crop.'),
              e(ExportBar, {
                photoId: photoId, cand: cand.cand, s: s, source: source,
              })),

            img && diag && e(Diagnostic, {
              d: diag, img: img, s: s, set: set, photoId: photoId,
              onSelectCand: () => {},
              onUpscaled: (res) => {
                // Adopt the file that was just written as the planning source,
                // so its real dimensions drive the plan (not an assumed factor).
                loadUps();
                if (res && res.output) setSource(res.output);
              },
            }),

            img && shown.length > 0 && e('div', { className: 'card', style: { marginTop: 16 } },
              e('div', { style: { display: 'flex', alignItems: 'baseline',
                                  justifyContent: 'space-between', gap: 12 } },
                e('h2', { style: { marginBottom: 0 } }, 'Other arrangements'),
                e(TryGrid, { onAdd: addTried })),
              e('p', { className: 'hint', style: { marginTop: 4 } },
                'Every size shown is edge-to-edge.'),
              e('div', { className: 'arrangements', style: { marginTop: 12 } },
                shown.map((c, i) => {
                  if (c.impossible) {
                    return e('div', { key: c.key, className: 'arr tried' },
                      e('button', {
                        className: 'del', title: 'Remove this arrangement',
                        onClick: (ev) => { ev.stopPropagation(); removeTried(c.key); },
                      }, '×'),
                      e('span', { className: 'big' },
                        c.cand.cols + '×' + c.cand.rows),
                      e('span', { className: 'sub' },
                        'No sheet size builds this under ' + G.MAX_SPAN_IN + '″.'));
                  }
                  const cp = c.P;
                  const failsDpi = cp.dpi < s.minDpi;
                  const failsCrop = (1 - cp.keep) > s.maxCrop + 0.0001;
                  return e('div', {
                    key: c.key || i,
                    className: 'arr' + (i === selIdx ? ' on' : '') + (c.tried ? ' tried' : ''),
                    onClick: () => setSel(i),
                  },
                    // The point of the thumbnail: the panel breakdown AND where
                    // the photo actually lands inside it.
                    img && src && e(MiniPreview, {
                      img: img, cand: c.cand, s: s, src: src, maxPx: 116 }),
                    c.tried && e('button', {
                      className: 'del', title: 'Remove this arrangement',
                      onClick: (ev) => { ev.stopPropagation(); removeTried(c.key); },
                    }, '×'),
                    e('span', { className: 'big' },
                      G.inches(cp.outerW) + ' × ' + G.inches(cp.outerH)),
                    e('span', { className: 'sub' },
                      c.cand.cols + '×' + c.cand.rows + ' · ' + G.sizeLabel(cp.pw, cp.ph) + '″'),
                    e('br'),
                    e('span', {
                      className: 'sub',
                      style: { color: failsDpi ? 'var(--red)' : 'var(--text-muted)' },
                    }, Math.round(cp.dpi) + ' dpi'),
                    e('span', { className: 'sub' }, ' · '),
                    e('span', {
                      className: 'sub',
                      style: { color: failsCrop ? 'var(--red)' : 'var(--text-muted)' },
                    }, G.pct(1 - cp.keep) + ' crop'),
                    c.tried && (failsDpi || failsCrop) && e('span', {
                      className: 'sub',
                      style: { display: 'block', color: 'var(--yellow)', marginTop: 2 },
                    }, 'below your floors'));
                }))))));
    }

    ReactDOM.createRoot(document.getElementById('root')).render(e(SplitPage));
  </script>
</body>
</html>
