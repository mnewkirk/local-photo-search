name: tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A new push to the same branch cancels the previous in-flight run.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 matches the Dockerfile (production); 3.14 matches the dev venv.
        python-version: ['3.11', '3.14']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The suite does NOT need the ML stack: tests/conftest.py mocks torch /
      # open_clip / insightface / onnxruntime / cv2 / ollama when they aren't
      # importable, so CI skips ~2 GB of wheels and installs in seconds.
      # Anything listed here is genuinely exercised by the tests.
      #   httpx     -> required by fastapi.testclient (transitive dep locally)
      #   scipy     -> real scipy needed; sklearn imports scipy.stats
      #   sqlite-vec-> loaded as a SQLite extension by photosearch.db
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            "pytest>=8.0" "pytest-cov>=5.0" \
            "click>=8.0" "numpy>=1.20" "pyyaml>=6.0" \
            "Pillow>=10.0" "exifread>=3.0" \
            "sqlite-vec>=0.1" "scikit-learn>=1.3" "scipy>=1.10" \
            "colorthief>=0.2.1" "reverse_geocoder>=1.5" \
            "fastapi>=0.110" httpx "requests>=2.31"

      # sqlite-vec is loaded via sqlite3.Connection.load_extension(), which is
      # compiled out of some Python builds. Fail loudly here rather than as a
      # confusing cascade of test errors.
      - name: Check SQLite extension loading is available
        run: |
          python - <<'PY'
          import sqlite3, sys
          c = sqlite3.connect(":memory:")
          if not hasattr(c, "enable_load_extension"):
              sys.exit("This Python build has no sqlite3 extension loading; sqlite-vec cannot work.")
          import sqlite_vec
          c.enable_load_extension(True)   # off by default; load_extension() 'not authorized' without it
          sqlite_vec.load(c)
          print("sqlite-vec OK:", c.execute("select vec_version()").fetchone()[0])
          PY

      - name: Run tests
        run: pytest -q
